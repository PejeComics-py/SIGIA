<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Registro de Usuario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="frontend/style/style.css">
</head>
<body class="bg-sigia-green min-vh-100 d-flex align-items-center justify-content-center p-3">
    <!-- Loading page -->
    <!--
		<div class="spinner-wrapper">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
         </div>
    </div>
		-->
    <!-- Formulario de Login/Registro -->
    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 450px;">
        <div class="card-body p-4 p-sm-5 text-center">

            <!-- Logo Temporal (Representando el logo de SIGIA de la imagen) -->
            <div class="logo-sigia container mb-3 position-relative">
							<img src="icons/iconLettersSigia.png" class="img-fluid">
            </div>

            <!-- Título del Formulario -->
            <h2 class="text-sigia-blue fw-bold mb-4 fs-3">Ingresar o Registrarse</h2>

            <!-- Formulario -->
						<form novalidate action="frontend/sigiaHomepage.html">
                <!-- Email -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="Email" required>
                </div>

                <!-- Contraseña -->
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Contraseña" required>
                </div>

                <!-- Olvidé contraseña -->
                <div class="text-start mb-4">
                    <a href="#" class="text-sigia-blue text-decoration-none fw-semibold" style="font-size: 0.85rem;">Olvidé contraseña</a>
                </div>

                <!-- Botón Ingresar -->
                <div class="container">
										<button type="submit" class="btn btn-sigia w-75 shadow-sm">Ingresar</button>
                </div>

                <!-- Enlaces Inferiores -->
                <div class="d-flex flex-column gap-2 mt-2" style="font-size: 0.9rem;">
                    <!-- Registarse aqui-->
                    <p class="text-sigia-blue">¿No tienes cuenta? Registrate <a href="frontend/sigiaSignUp.html" class="text-sigia-blue-underline text-decoration-none fw-semibold mt-2">aquí</a></p>
                </div>
            </form>
        </div>
    </div>
		<!-- Script para page loading -->
		<!--<script src="scripts/validate.js"></script>-->
</body>
</html>
