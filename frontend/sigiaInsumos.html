<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Gestión de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Paleta de colores oficial de SIGIA */
        :root {
            --sigia-green: #88BF50;
            --sigia-teal: #119195;
            --sigia-blue: #16558C;
            --sigia-green-dark: #10AB5E;
            --sigia-blue-light: #0B7CB1;
        }

        /* Paleta de colores */
        .text-sigia-blue { color: var(--sigia-blue) !important; }
        .text-sigia-teal { color: var(--sigia-teal) !important; }
        .bg-sigia-green { background-color: var(--sigia-green) !important; }
        .bg-sigia-blue { background-color: var(--sigia-blue) !important; }

        /* Botón Flotante ('+') */
        .btn-sigia-fab {
            background-color: var(--sigia-blue);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(22, 85, 140, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            border: none;
        }
        .btn-sigia-fab:hover {
            background-color: var(--sigia-blue-light);
            transform: scale(1.05);
            color: white;
        }

        /* Estilos del Modal (Formulario de Registro) */
        .btn-sigia-modal-submit {
            background-color: var(--sigia-green);
            color: white;
            font-weight: bold;
            border-radius: 20px;
            padding: 8px 35px;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-sigia-modal-submit:hover {
            background-color: var(--sigia-green-dark);
            color: white;
        }

        /* Deshabilitado estilo Figma */
        .bg-figia-disabled {
            background-color: #e9ecef !important;
            color: var(--sigia-blue) !important;
            font-weight: bold;
        }

        /* Ocultar barra de scroll */
        .scroll-hidden::-webkit-scrollbar { display: none; }
        .scroll-hidden { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-link-sigia { color: #6c757d; }
        .nav-link-sigia.active {
            color: var(--sigia-blue) !important;
            border-top: 3px solid var(--sigia-green) !important;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <div class="container-fluid my-0 my-md-4 flex-grow-1 d-flex justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 px-0 px-md-3">
                
                <div class="card border-0 shadow-sm min-vh-100 min-vh-md-auto rounded-0 rounded-md-4 overflow-hidden position-relative bg-white pb-5">
                    
                    <div class="card-body pt-4 px-4 text-center">
                        <h1 class="text-sigia-blue fw-bold fs-2 mb-4">Insumos</h1>
                        
                        <div class="input-group mb-3 rounded-pill border shadow-sm overflow-hidden px-2 bg-white">
                            <span class="input-group-text bg-white border-0 text-secondary"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-0 ps-1 py-2 text-secondary" placeholder="Buscar...">
                        </div>

                        <div class="d-flex gap-2 overflow-x-auto pb-2 scroll-hidden text-nowrap">
                            <span class="badge bg-sigia-green rounded-pill px-3 py-2 fs-6"><i class="bi bi-star-fill me-1"></i> Label</span>
                            <span class="badge bg-sigia-green rounded-pill px-3 py-2 fs-6"><i class="bi bi-star-fill me-1"></i> Label</span>
                            <span class="badge bg-sigia-green rounded-pill px-3 py-2 fs-6"><i class="bi bi-star-fill me-1"></i> Label</span>
                        </div>
                    </div>

                    <div class="px-4">
                        <h3 class="text-sigia-blue fw-bold fs-4 mb-3">Registros</h3>
                        
                        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                            <div class="table-responsive">
                                <table class="table table-borderless align-middle mb-0 text-center">
                                    <thead class="table-light text-secondary border-bottom">
                                        <tr class="small fw-bold">
                                            <th class="py-3 text-start ps-4">Insumo</th>
                                            <th class="py-3">Cantidad</th>
                                            <th class="py-3 pe-4">Fecha</th>
                                        </tr>
                                    </thead>
                                    <tbody class="small fw-semibold">
                                        <tr class="border-bottom">
                                            <td class="py-3 text-start ps-4 text-sigia-blue"><i class="bi bi-record-circle-fill text-sigia-teal me-2"></i>Fertilizante</td>
                                            <td class="py-3 text-secondary text-nowrap">300g <i class="bi bi-caret-right-fill text-muted small ms-1"></i></td>
                                            <td class="py-3 text-sigia-blue pe-4">25-06</td>
                                        </tr>
                                        <tr class="border-bottom">
                                            <td class="py-3 text-start ps-4 text-sigia-blue"><i class="bi bi-record-circle-fill text-sigia-teal me-2"></i>Fertilizante</td>
                                            <td class="py-3 text-secondary text-nowrap">300g <i class="bi bi-caret-right-fill text-muted small ms-1"></i></td>
                                            <td class="py-3 text-sigia-blue pe-4">25-06</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="position-absolute bottom-0 end-0 mb-5 me-4 pb-4">
                        <button class="btn btn-sigia-fab" data-bs-toggle="modal" data-bs-target="#modalRegistrarInsumo" title="Registrar nuevo insumo">
                            <i class="bi bi-plus fs-2"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalRegistrarInsumo" tabindex="-1" aria-labelledby="modalRegistrarInsumoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-4">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                
                <div class="modal-header border-0 pb-0 pe-4 pt-3 justify-content-end">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body px-4 pb-4 pt-0 text-center">
                    <h2 class="text-sigia-blue fw-bold fs-3 mb-4" id="modalRegistrarInsumoLabel">Registrar Insumo</h2>
                    
                    <form>
                        <div class="mb-3 text-start">
                            <label class="form-label text-sigia-blue fw-bold mb-1">Tipo de Insumo</label>
                            <select class="form-select rounded-pill border-secondary-subtle py-2 text-secondary fw-semibold" required>
                                <option value="" selected disabled>Selecciona el tipo de insumo</option>
                                <option value="fertilizante">Fertilizante</option>
                                <option value="pesticida">Pesticida</option>
                                <option value="sustrato">Sustrato</option>
                            </select>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label text-sigia-blue fw-bold mb-1">ID</label>
                            <div class="input-group rounded-pill border border-secondary-subtle overflow-hidden bg-figia-disabled px-2">
                                <span class="input-group-text bg-transparent border-0 text-secondary"><i class="bi bi-lock-fill"></i></span>
                                <input type="text" class="form-control bg-transparent border-0 py-2 text-center bg-figia-disabled" value="INS-0000" readonly>
                            </div>
                            <small class="text-muted d-block text-center mt-1" style="font-size: 0.75rem;">ID se genera automáticamente</small>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-7 text-start">
                                <label class="form-label text-sigia-blue fw-bold mb-1">Cantidad</label>
                                <input type="text" class="form-control rounded-pill border-secondary-subtle py-2 text-secondary text-center fw-semibold" placeholder="EJ. 20" required>
                            </div>
                            
                            <div class="col-5 text-start">
                                <label class="form-label text-sigia-blue fw-bold mb-1">Unidad</label>
                                <select class="form-select rounded-pill border-secondary-subtle py-2 text-secondary text-center fw-bold" required>
                                    <option value="KG">KG</option>
                                    <option value="G">G</option>
                                    <option value="L">L</option>
                                    <option value="ML">ML</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-2">
                            <button type="submit" class="btn btn-sigia-modal-submit shadow-sm">Registrar</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div class="bg-white border-top shadow w-100 position-sticky bottom-0 z-3">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <nav class="nav nav-justified py-1">
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaHomepage.html"><i class="bi bi-house-door d-block fs-4"></i><span class="small fw-bold">Home</span></a>
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaTasks.html"><i class="bi bi-calendar-check d-block fs-4"></i><span class="small fw-bold">Tareas</span></a>
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaInsumos.html"><i class="bi bi-box-seam-fill d-block fs-4"></i><span class="small fw-bold">Insumos</span></a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
