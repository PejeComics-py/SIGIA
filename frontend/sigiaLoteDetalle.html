<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Detalle de lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style/loteDetalle.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <div class="container-fluid my-0 my-md-4 flex-grow-1 d-flex justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 px-0 px-md-3">

                <div class="card border-0 shadow-sm min-vh-100 rounded-0 rounded-md-4 overflow-hidden bg-white pb-5">
                    <div class="card-body pt-4 px-4">

                        <a href="sigiaLotes.html" class="fw-bold fs-5 text-decoration-none" style="color: var(--sigia-blue-soft);">
                            <i class="bi bi-arrow-left me-2"></i>Lotes
                        </a>

                        <!-- Lote no encontrado -->
                        <div id="noEncontrado" class="text-center text-secondary mt-5" hidden>
                            <p class="mb-1">No encontramos este lote.</p>
                            <a href="sigiaLotes.html" class="fw-bold text-sigia-blue">Volver a Lotes</a>
                        </div>

                        <div id="detalle" hidden>
                            <!-- Encabezado: nombre, estado y última actualización -->
                            <div class="d-flex justify-content-between align-items-start mt-4">
                                <h1 id="nombreLote" class="text-sigia-blue fw-bold fs-2 mb-0"></h1>
                                <div class="position-relative">
                                    <button id="btnEstado" type="button" class="estado-btn" aria-haspopup="true" aria-expanded="false" aria-controls="panelEstado"></button>

                                    <!-- Formulario: Cambiar estado -->
                                    <form id="panelEstado" class="estado-panel" hidden>
                                        <fieldset class="border-0 p-0 m-0">
                                            <legend class="fs-6 fw-bold text-sigia-blue text-center mb-2">Cambiar estado</legend>
                                            <label class="estado-opcion">
                                                <input type="radio" name="estadoLote" value="optimo">
                                                <span class="estado-punto" style="background-color: #88BF50;"></span>Óptimo
                                            </label>
                                            <label class="estado-opcion">
                                                <input type="radio" name="estadoLote" value="atencion">
                                                <span class="estado-punto" style="background-color: #d9ae3e;"></span>Atención
                                            </label>
                                            <label class="estado-opcion">
                                                <input type="radio" name="estadoLote" value="riesgo">
                                                <span class="estado-punto" style="background-color: #cf5353;"></span>Riesgo
                                            </label>
                                        </fieldset>
                                    </form>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 mt-2 fw-bold small" style="color: var(--sigia-blue-soft);">
                                <i class="bi bi-calendar3 fs-3"></i>
                                <div>
                                    Última actualización:<br>
                                    <span id="fechaLote" class="ms-3"></span>
                                </div>
                            </div>

                            <!-- Tareas del lote -->
                            <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
                                <h2 class="text-sigia-blue fw-bold fs-5 mb-0">Tareas del lote</h2>
                                <button type="button" class="btn-sigia-outline" data-bs-toggle="modal" data-bs-target="#modalAgregarTarea">Agregar Tarea +</button>
                            </div>
                            <p id="avisoTarea" class="small fw-bold text-success text-center" role="status" hidden></p>
                            <div id="listaTareas" class="d-flex flex-column gap-3"></div>

                            <!-- Eliminar lote -->
                            <div class="border-top mt-5 pt-4 text-center">
                                <button type="button" class="btn-sigia-danger-outline" data-bs-toggle="modal" data-bs-target="#modalEliminarLote">
                                    <i class="bi bi-trash me-1"></i>Eliminar lote
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓN INFERIOR (pestaña Lotes activa) -->
    <div class="bg-white border-top shadow w-100 position-sticky bottom-0 z-3">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <nav class="nav nav-justified py-1">
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaHomepage.html">
                            <i class="bi bi-house-door d-block fs-4"></i><span class="small fw-bold">Home</span>
                        </a>
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaTasks.html">
                            <i class="bi bi-calendar-check d-block fs-4"></i><span class="small fw-bold">Tareas</span>
                        </a>
                        <a class="nav-link nav-link-sigia py-2 text-center" href="sigiaInsumos.html">
                            <i class="bi bi-box-seam d-block fs-4"></i><span class="small fw-bold">Insumos</span>
                        </a>
                        <a class="nav-link nav-link-sigia active py-2 text-center" href="sigiaLotes.html">
                            <i class="bi bi-grid-1x2-fill d-block fs-4"></i><span class="small fw-bold">Lotes</span>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: confirmar eliminación del lote -->
    <div class="modal fade" id="modalEliminarLote" tabindex="-1" aria-labelledby="tituloEliminarLote" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-4">
            <div class="modal-content border-0 rounded-4 shadow-lg text-center p-4">
                <i class="bi bi-exclamation-triangle fs-1" style="color: var(--sigia-red);"></i>
                <h2 id="tituloEliminarLote" class="fs-5 fw-bold text-sigia-blue mt-2">¿Eliminar <span id="nombreEliminar"></span>?</h2>
                <p class="small text-secondary mb-4">También se eliminarán sus tareas. Esta acción no se puede deshacer.</p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn-sigia-outline" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarEliminar" class="btn-sigia-danger">Sí, eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Agregar tarea -->
    <div class="modal fade" id="modalAgregarTarea" tabindex="-1" aria-labelledby="tituloAgregarTarea" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-3">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-body p-4">
                    <h2 id="tituloAgregarTarea" class="text-sigia-blue fw-bolder text-center mb-3">Agregar tarea</h2>
                    <form id="formTarea" class="form-sigia border rounded-3 p-3" style="border-color: rgba(22, 85, 140, 0.5) !important;" novalidate>
                        <label for="tareaTipo" class="mb-1">Tipo de tarea *</label>
                        <select id="tareaTipo" class="form-select mb-2" required>
                            <option value="" selected disabled>Selecciona tipo de tarea</option>
                            <option>Preparar terreno</option>
                            <option>Sembrar</option>
                            <option>Regar</option>
                            <option>Fertilizar</option>
                            <option>Podar</option>
                            <option>Cosechar</option>
                        </select>

                        <label for="tareaLote" class="mb-1">Lote *</label>
                        <select id="tareaLote" class="form-select mb-2" required></select>

                        <label for="tareaResp" class="mb-1">Usuario responsable *</label>
                        <div class="position-relative mb-2">
                            <input id="tareaResp" type="text" class="form-control pe-5" list="listaUsuarios" placeholder="Busque usuario responsable" autocomplete="off" required>
                            <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3 text-sigia-blue"></i>
                            <!-- TODO: llenar con los usuarios reales desde el backend -->
                            <datalist id="listaUsuarios">
                                <option value="William S."></option>
                                <option value="Laura M."></option>
                                <option value="Carlos R."></option>
                            </datalist>
                        </div>

                        <label for="tareaFecha" class="mb-1">Fecha asignada *</label>
                        <input id="tareaFecha" type="date" class="form-control mb-2" required>

                        <label for="tareaInstr" class="mb-1">Instrucción *</label>
                        <textarea id="tareaInstr" class="form-control" rows="5" maxlength="500" placeholder="Ej. Aplicar fertilizante a lote B" required></textarea>
                        <div id="contadorInstr" class="text-end small fw-bold text-sigia-blue mb-2">0/500</div>

                        <div id="errorTarea" class="text-danger small text-center mb-2" hidden>Completa todos los campos obligatorios.</div>

                        <div class="text-center">
                            <button type="submit" class="btn-sigia-solid">Guardar</button><br>
                            <a href="#" class="small fw-bold text-sigia-blue mt-1 d-inline-block" data-bs-dismiss="modal">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../backend/loteDetalle.js"></script>
</body>
</html>
