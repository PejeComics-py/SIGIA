<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Reiniciar contraseña</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style/form.css" rel="stylesheet">
</head>
<body class="bg-sigia-green min-vh-100 d-flex align-items-center justify-content-center p-3">
 
    <!-- Formulario de Login/Registro -->
    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 450px;">
        <div class="card-body p-4 p-sm-5 text-center">

            <!-- Logo -->
            <div class="logo-sigia container mb-3 position-relative">
                <img src="../icons/iconLettersSigia.png" class="img-fluid" alt="SIGIA logo">
            </div>

            <!-- Título del Formulario -->
            <h2 class="text-sigia-blue fw-bold mb-4 fs-3">Reiniciar contraseña</h2>

            <!-- Error message-->
            <div class="container d-flex justify-content-center">
                <div id="errorMensaje" class="d-none"></div>
            </div>
            <!-- Formulario -->
			<form novalidate id="loginForm">
                <!-- Contraseña -->
                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Contraseña" id="contraseña" maxlength="50" required>
                </div>

                <!-- Repetir contraseña -->
                <div class="input-group mb-5">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class= "form-control" placeholder="Repetir contraseña" id="rcontraseña" maxlength="50" required>
				</div>

                <!-- Boton de guardar -->
                <div class="container">
                    <button type="submit" class="btn btn-sigia w-75 shadow-sm">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <!--
        TODO: Make script to save new password
        <script src="backend/loginScript.js"></script>
    -->
</body>
</html>
