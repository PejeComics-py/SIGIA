<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Olvidé contraseña</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style/form.css" rel="stylesheet">
</head>
<body class="bg-sigia-green min-vh-100 d-flex align-items-center justify-content-center p-3">
 
    <!-- Formulario de Login/Registro -->
    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 450px;">
        <div class="card-body p-4 p-sm-5 text-center">

            <!-- Logo -->
            <div class="logo-sigia container mb-3 position-relative">
                <img src="../icons/iconLettersSigia.png" class="img-fluid" alt="SIGIA logo">
            </div>

            <!-- Título del Formulario -->
            <h2 class="text-sigia-blue fw-bold mb-4 fs-3">¿Olvidaste tu contraseña?</h2>

            <!-- Error message-->
            <div class="container d-flex justify-content-center">
                <div id="errorMensaje" class="d-none"></div>
            </div>

            <!-- Formulario -->
			<form novalidate id="emailForm">
                <!-- Description -->
                <p class="text-sigia-blue">No te preocupes. Enviaremos un link para reiniciar tu contraseña al correo que proveas</p>
                <!-- Email -->
                <div class="input-group mb-5">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="Email" id="email" required>
                </div>
                <!-- Botón Ingresar -->
                <div class="container">
                    <button type="submit" class="btn btn-sigia w-75 shadow-sm">Enviar link</button>
                </div>

                <!-- Enlaces Inferiores -->
                <div class="d-flex flex-column gap-2 mt-1" style="font-size: 0.9rem;">
                    <!-- Volver a ventana de inicio-->
                    <p class="text-sigia-blue mt-1 "><a href="../index.html" class="text-sigia-blue-underline text-decoration-none fw-semibold mt-2">Ingresar</a> | <a href="./sigiaSignUp.html" class="text-sigia-blue-underline text-decoration-none fw-semibold mt-2">Registrarse</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="../backend/sendEmail.js"></script>
</body>
</html>
