<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIA - Registro de Usuario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body class="bg-sigia-green min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 450px;">
        <div class="card-body p-4 p-sm-5 text-center">

            <!-- Logo Temporal (Representando el logo de SIGIA de la imagen) -->
            <div class="logo-sigia container mb-3 position-relative">
							<img src="../icons/iconLettersSigia.png" class="img-fluid">
            </div>

            <!-- Título del Formulario -->
            <h2 class="text-sigia-blue fw-bold mb-4 fs-3">Registro de Usuario</h2>

            <!-- Error message -->
            <div class="container d-flex justify-content-center">
                <div id="errorMensaje" class="d-none"></div> 
            </div>

            <!-- Formulario -->
            <form novalidate id="registerForm"> 
                <!--Grupo nombres-->   
                <div class="form-group">
                    <!-- Input Nombres -->
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                        <input type="text" class="form-control" placeholder="Nombres" id="nombres" maxlength="50" required>
					</div>
				</div>
                <!-- Apellidos -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                    <input type="text" class="form-control" placeholder="Apellidos" id="apellidos" maxlength="50" required>
                </div>
                <!-- Email -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="Email" id="email" maxlength="50" required>
                </div>

                <!-- Contraseña -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Contraseña" id="contraseña" maxlength="50" required>
                </div>
                
                <!-- Repetir contraseña-->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class= "form-control" placeholder="Repetir contraseña" id="rcontraseña" maxlength="50" required>
				</div>

                <!-- Olvidé contraseña -->
                <div class="text-start mb-4">
                    <a href="#" class="text-sigia-blue text-decoration-none fw-semibold" style="font-size: 0.85rem;">Olvidé contraseña</a>
                </div>

                <!-- Botón Registrarse -->
                <div class="mb-4">
                    <button type="submit" class="btn btn-sigia w-75 shadow-sm">Registrarse</button>
                </div>

                <!-- Enlaces Inferiores -->
                <div class="d-flex flex-column gap-2" style="font-size: 0.9rem;">
                    <p><a href="../index.html" class="text-sigia-blue-underline text-decoration-none fw-semibold mt-2">Cancelar</a></p>
                </div>
            </form>
        </div>
    </div>
    <script>
        /*Functions for scripts*/
        function mostrarAlerta(mensaje, tipo) {
            let icon;
            if(tipo === "danger") {
                icon = "bi bi-exclamation-diamond";
            }

            if(tipo === "warning") {
                icon = "bi bi-info-circle";
            }

            if(tipo === "success") {
                icon = "bi bi-check";
            }

            /*Show alert*/
            const errorMensaje = document.getElementById("errorMensaje")
            errorMensaje.className = `alert alert-${tipo} mb-3 text-center ${icon}`;

            errorMensaje.innerHTML = ` ${mensaje}`;
            /*Remove d-none class from bootstrap to make alert visible*/
            errorMensaje.classList.remove("d-none")
        }

        function checkUserInput(nombres,apellidos,email,password,rpassword) {
            /*Check inputs*/ 
            if(nombres === "" || apellidos === "" || email === "" || password === "") {
                mostrarAlerta("Faltan campos por completar", "danger")
                return false
            }
            if (!nombres.match(/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/)) {
                /*Show error for names*/ 
                mostrarAlerta("No se aceptan numeros en nombres", "warning")
                return false
            } 
            if(!apellidos.match(/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/)) {
                /*Show error for lastnames*/ 
                mostrarAlerta("WARN: No se aceptan numeros en apellidos", "warning")
                return false
            }
            if (password !== rpassword) {
                /*Return error for password and rpassword no matching*/
                mostrarAlerta("WARN: Las contraseñas no coinciden","warning")
                return false 
            }
            return true

        } 

        /*------- MAIN SCRIPT -------*/
        /*Get submit button form by ID*/
        const submit = document.getElementById("registerForm")
       
        /*Add event to submit button and wait for response*/
        submit.addEventListener("submit", async (button_event) => {
            /* Save the values placed inside form*/
            const nombres = document.getElementById("nombres").value;
            const apellidos = document.getElementById("apellidos").value;
	        const email = document.getElementById("email").value;
	        const password = document.getElementById("contraseña").value;
            const rpassword = document.getElementById("rcontraseña").value;
            /*Prevent event until something is returned*/
            button_event.preventDefault();

            /*Return if form does not comply given criteria*/
            if (!checkUserInput(nombres,apellidos,email,password,rpassword)) {
                return 
            }

            try {
                /* Fetch response with a return the promise promise*/
                // fetch(resource, response)
                const respuesta = await fetch("http://localhost:3000/register", {                     
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombres, apellidos, email, password })
                });

                /*Wait for the server response and save response in .json()*/
                const result = await respuesta.json();
                if(respuesta.ok) {
                    mostrarAlerta(result.mensaje, "success")
                    console.log(result.mensaje);
                    setTimeout(function() {
                        window.location.href = "../index.html"
                    }, 1500);
                } else {
                    mostrarAlerta(result.mensaje, "danger")
                }
            } catch(error){
                console.error("Error en la peticion: ", error);
                mostrarAlerta("No se pudo conectar con el servidor.", "danger")
            }
        });
    </script>
</body>
</html>
